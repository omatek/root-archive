name: CI

on:
  pull_request:
  push:
    branches: [main, feat/development-foundations]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: node scripts/catalogs.mjs
      - run: node --test scripts/*.test.mjs
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 -m unittest discover -s analytics/tests -v
      - name: Reproduce synthetic data and analysis
        run: |
          python3 analytics/generate.py --count 200 --seed 42 --output analytics/output/events.jsonl
          python3 analytics/analyze.py analytics/output/events.jsonl --output analytics/output/report

  worker:
    name: Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker --no-audit --no-fund
      - run: npm --prefix worker run check
